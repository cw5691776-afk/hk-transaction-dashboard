name: Daily transaction refresh
description: Refresh the HK estate transaction dataset from public provider pages.
on:
  schedule:
    # 07:10 HKT = 23:10 UTC (previous day)
    - cron: "10 23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: transaction-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update transaction data
        run: |
          # GitHub's shared runner IPs are occasionally challenged by 28Hse
          # and Midland. Retry until every provider returns records so a
          # transient block cannot publish a dataset with missing sources.
          for attempt in 1 2 3 4; do
            echo "=== attempt $attempt ==="
            python scripts/update_data.py || true
            if python scripts/check_sources.py; then
              echo "all sources returned records"
              break
            fi
            echo "some sources returned 0; retrying in 30s"
            sleep 30
          done

      - name: Commit refreshed dataset
        run: |
          # Only publish a dataset when every provider returned records;
          # otherwise keep the previous complete dataset in place.
          if ! python scripts/check_sources.py; then
            echo "::warning::One or more sources returned 0 records; keeping previous dataset."
            git checkout -- data/transactions.json data/source-state.json data/update-report.json
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/transactions.json data/update-report.json data/source-state.json
          if git diff --staged --quiet; then
            echo "No dataset changes."
          else
            git commit -m "data: refresh estate transactions"
            git push
          fi

  deploy:
    needs: update
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deploy
        uses: actions/deploy-pages@v4
